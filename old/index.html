<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
      <span>
        <img src="./bg.jpg" alt="blue laptop with coins" class="header-bg">
       <img src="./logo.svg" alt="company logo" class="header-logo">
      </span>
    </header>
    <section class="right-side">
    <h1 class="right-text">Get iintoo it today</h1>
    <p>There is no charge or obligation upon registration.</p>
    <a href="https://facebook.com" target="_blank">
      <button class="button-facebook">
        <img src=".//facebook.svg" alt="facebook button" class="registration-fb" > 
        Register with Facebook
      </button>
    </a>
    <a href="https://www.linkedin.com" target="_blank">
      <button class="button-linkedin">
        <img src=".//linkedin.svg" alt=" linked in button" class="registration-lin"> 
        Register with Linkedin    
       </button>
    </a>    
   <span class="or">
    <span class="line"></span>
    <span>OR</span>
    <span class="line"></span>
   </span>
  <form class="registration-form">
    <input type="email" placeholder="Email">
    <input type="phone" placeholder="Phone">
  </form>
  </section>
</body>

</html>
